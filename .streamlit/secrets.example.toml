# Example Streamlit secrets file.
# Copy this to .streamlit/secrets.toml locally or configure these values in Streamlit Cloud.
# Do NOT commit real API keys or secrets.

TRADING_MODE = "paper"

ENABLE_LIVE_TRADING = false
REQUIRE_MANUAL_APPROVAL = true

MAX_POSITION_PCT = 0.25
CASH_BUFFER_PCT = 0.15

[alpaca.paper]
API_KEY = "your_paper_api_key_here"
SECRET_KEY = "your_paper_secret_key_here"
BASE_URL = "https://paper-api.alpaca.markets"

[alpaca.live]
API_KEY = "your_live_api_key_here"
SECRET_KEY = "your_live_secret_key_here"
BASE_URL = "https://api.alpaca.markets"
